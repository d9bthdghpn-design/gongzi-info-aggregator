version: '3.8'

services:
  # PostgreSQL数据库
  postgres:
    image: postgres:15-alpine
    container_name: gongzi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gongzi_info}
      POSTGRES_USER: ${POSTGRES_USER:-gongzi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gongzi123}
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gongzi} -d ${POSTGRES_DB:-gongzi_info}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gongzi-network

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: gongzi-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gongzi-network

  # 后端API服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gongzi-backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-gongzi}:${POSTGRES_PASSWORD:-gongzi123}@postgres:5432/${POSTGRES_DB:-gongzi_info}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/2
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-please-change-this-secret-key}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8080}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_BASE_URL=${AI_BASE_URL:-}
      - AI_MODEL=${AI_MODEL:-gpt-3.5-turbo}
      - FEISHU_WEBHOOK_URL=${FEISHU_WEBHOOK_URL:-}
      - FEISHU_WEBHOOK_SECRET=${FEISHU_WEBHOOK_SECRET:-}
      - WECOM_WEBHOOK_URL=${WECOM_WEBHOOK_URL:-}
      - TZ=Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - gongzi-network

  # Celery Worker（含采集任务，通过 CrawlerRunner 运行 Scrapy）
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gongzi-celery-worker
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    volumes:
      # 挂载爬虫代码，使 Celery worker 可访问 crawler 模块
      - ./crawler:/app/crawler
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-gongzi}:${POSTGRES_PASSWORD:-gongzi123}@postgres:5432/${POSTGRES_DB:-gongzi_info}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/2
      - SCRAPY_SETTINGS_MODULE=crawler.settings
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-please-change-this-secret-key}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_BASE_URL=${AI_BASE_URL:-}
      - AI_MODEL=${AI_MODEL:-gpt-3.5-turbo}
      - FEISHU_WEBHOOK_URL=${FEISHU_WEBHOOK_URL:-}
      - FEISHU_WEBHOOK_SECRET=${FEISHU_WEBHOOK_SECRET:-}
      - WECOM_WEBHOOK_URL=${WECOM_WEBHOOK_URL:-}
      - TZ=Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gongzi-network

  # Celery Beat（定时任务调度）
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gongzi-celery-beat
    restart: unless-stopped
    command: celery -A app.tasks.celery_app beat --loglevel=info
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-gongzi}:${POSTGRES_PASSWORD:-gongzi123}@postgres:5432/${POSTGRES_DB:-gongzi_info}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/2
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-please-change-this-secret-key}
      - FEISHU_WEBHOOK_URL=${FEISHU_WEBHOOK_URL:-}
      - WECOM_WEBHOOK_URL=${WECOM_WEBHOOK_URL:-}
      - TZ=Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gongzi-network

  # 前端Web
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gongzi-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - gongzi-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  gongzi-network:
    driver: bridge
