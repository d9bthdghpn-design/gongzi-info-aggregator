# Render 一键部署配置
# 用法：在 Render Dashboard 中选择 "Deploy from YAML"，选择本文件即可一键部署
#
# 架构：单服务（FastAPI 后端 + 前端静态文件）+ Redis
# 前端由根 Dockerfile 多阶段构建后复制到 backend/static，由 FastAPI 统一提供
#
# 注意：
# 1. Render 免费版无法运行 Celery Worker/Beat，采集/AI/简报推送需手动触发或升级套餐
# 2. DATABASE_URL 需在部署后在 Render 环境变量中填入 Supabase 连接串
# 3. 首次部署后会自动运行 init_db.py 初始化数据库

services:
  # ==================== 主服务（后端+前端） ====================
  - type: web
    name: gongzi-info
    runtime: docker
    repo: https://github.com/d9bthdghpn-design/gongzi-info-aggregator.git
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false  # 部署后在 Render Dashboard 填入 Supabase 连接串
      - key: REDIS_URL
        fromService:
          name: gongzi-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: gongzi-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: gongzi-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://gongzi-info.onrender.com,http://localhost:8080,http://localhost:5173"
      - key: AI_API_KEY
        sync: false  # 部署后填入 DeepSeek API Key
      - key: AI_BASE_URL
        value: "https://api.deepseek.com"
      - key: AI_MODEL
        value: "deepseek-chat"
      - key: AI_AUTO_PUBLISH_SCORE
        value: "60"
      - key: HIGH_VALUE_SCORE
        value: "80"
      - key: FEISHU_WEBHOOK_URL
        sync: false  # 可选：飞书机器人 Webhook
      - key: FEISHU_WEBHOOK_SECRET
        sync: false  # 可选：飞书机器人签名密钥
      - key: WECOM_WEBHOOK_URL
        sync: false  # 可选：企微机器人 Webhook
      - key: BRIEFING_PUSH_HOUR
        value: "7"
      - key: BRIEFING_PUSH_MINUTE
        value: "30"
    healthCheckPath: /health
    autoDeploy: true

  # ==================== Redis 缓存（Celery Broker） ====================
  - type: redis
    name: gongzi-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
