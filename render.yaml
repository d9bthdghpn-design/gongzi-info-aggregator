# Render 一键部署配置
# 用法：在Render Dashboard 中选择 "Deploy from YAML" 即可一键部署所有服务
#
# 注意：Render 免费版无法运行 Celery Worker/Beat 后台进程，
# 因此采集、AI处理、定时简报推送等异步功能在 Render 免费版上不可用。
# 如需完整功能，请使用 docker-compose 部署（见 docker-compose.yml）。

services:
  # ==================== 后端服务 ====================
  - type: web
    name: gongzi-backend
    runtime: docker
    repo: https://github.com/d9bthdghpn-design/gongzi-info-aggregator.git
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gongzi-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: gongzi-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: gongzi-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: gongzi-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://gongzi-frontend.onrender.com"
      - key: AI_API_KEY
        value: ""
      - key: AI_BASE_URL
        value: ""
      - key: AI_MODEL
        value: "gpt-3.5-turbo"
      - key: FEISHU_WEBHOOK_URL
        value: ""
      - key: WECOM_WEBHOOK_URL
        value: ""
    healthCheckPath: /health
    autoDeploy: true

  # ==================== 前端服务 ====================
  - type: web
    name: gongzi-frontend
    runtime: static
    repo: https://github.com/d9bthdghpn-design/gongzi-info-aggregator.git
    branch: main
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    plan: free
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: gongzi-backend
          type: web
          property: url
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ==================== Redis 缓存 ====================
  - type: redis
    name: gongzi-redis
    plan: free
    maxmemoryPolicy: allkeys-lru

# ==================== PostgreSQL 数据库 ====================
databases:
  - name: gongzi-db
    databaseName: gongzi_info
    user: gongzi
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow all (for development)
